<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="coldstart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/><stop offset="100%" stop-color="#12161b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="218" fill="none" stroke="#1e242c" stroke-width="2"/>

  <!-- bars grow in on load, then hold: the measured Brier curve -->
  <g transform="translate(70,168)">
    <line x1="-16" y1="-118" x2="330" y2="-118" stroke="#8b97a5" stroke-width="1.5" stroke-dasharray="7 7" opacity="0.55"/>
    <text x="336" y="-114" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8b97a5">0.25 = coin flip</text>
    <line x1="-16" y1="1" x2="330" y2="1" stroke="#1e242c" stroke-width="2.5"/>

    <rect x="0" y="0" width="40" height="0" rx="4" fill="#f5a524" opacity="0.92">
      <animate attributeName="height" from="0" to="106" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="0" to="-106" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="58" y="0" width="40" height="0" rx="4" fill="#3ddc97" opacity="0.85">
      <animate attributeName="height" from="0" to="43" dur="1.1s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="0" to="-43" dur="1.1s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="116" y="0" width="40" height="0" rx="4" fill="#3ddc97" opacity="0.72">
      <animate attributeName="height" from="0" to="21" dur="1.1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="0" to="-21" dur="1.1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="174" y="0" width="40" height="0" rx="4" fill="#3ddc97" opacity="0.60">
      <animate attributeName="height" from="0" to="9" dur="1.1s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="0" to="-9" dur="1.1s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <rect x="232" y="0" width="40" height="0" rx="4" fill="#3ddc97" opacity="0.48">
      <animate attributeName="height" from="0" to="4" dur="1.1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="0" to="-4" dur="1.1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>

    <g font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8b97a5" text-anchor="middle">
      <text x="20" y="20">1m</text><text x="78" y="20">5m</text><text x="136" y="20">15m</text>
      <text x="194" y="20">60m</text><text x="252" y="20">240m</text>
    </g>
  </g>

  <g transform="translate(440,0)">
    <text x="0" y="88" font-family="ui-monospace,Menlo,monospace" font-size="46" font-weight="600" fill="#e8edf2" letter-spacing="-1">coldstart</text>
    <text x="0" y="122" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#8b97a5">
      which Event Contract windows are worth an opinion
    </text>
    <text x="0" y="152" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#6ea8fe" opacity="0">
      14,400 settled windows · 2 venues · measured, not asserted
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.1s" fill="freeze"/>
    </text>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.5s" fill="freeze"/>
      <rect x="0" y="168" width="9" height="9" rx="2" fill="#3ddc97"/>
      <text x="18" y="177" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8b97a5">live on Somnia mainnet + Shannon</text>
    </g>
  </g>
</svg>
