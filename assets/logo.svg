<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="480" height="480" rx="96" fill="#0b0d10"/>
  <rect x="6" y="6" width="468" height="468" rx="90" fill="none" stroke="#1e242c" stroke-width="2"/>

  <!-- five bars: the Brier curve, tall at 1m falling to flat at 240m -->
  <g transform="translate(96,300)">
    <rect x="0"   y="-150" width="42" height="150" rx="6" fill="#f5a524" opacity="0.92"/>
    <rect x="62"  y="-61"  width="42" height="61"  rx="6" fill="#3ddc97" opacity="0.85"/>
    <rect x="124" y="-30"  width="42" height="30"  rx="6" fill="#3ddc97" opacity="0.72"/>
    <rect x="186" y="-13"  width="42" height="13"  rx="6" fill="#3ddc97" opacity="0.60"/>
    <rect x="248" y="-5"   width="42" height="5"   rx="6" fill="#3ddc97" opacity="0.48"/>
    <!-- coin-flip reference line at 0.25 -->
    <line x1="-14" y1="-170" x2="304" y2="-170" stroke="#8b97a5" stroke-width="2" stroke-dasharray="8 8" opacity="0.7"/>
    <line x1="-14" y1="2"    x2="304" y2="2"    stroke="#1e242c" stroke-width="3"/>
  </g>

  <text x="240" y="386" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="54" font-weight="600" fill="#e8edf2" letter-spacing="-1">coldstart</text>
  <text x="240" y="422" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="20" fill="#8b97a5" letter-spacing="3">1m · · · · 240m</text>
</svg>
